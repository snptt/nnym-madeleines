<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>清系春城 · 推送渲染系统使用指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1E1E1E;overflow:hidden;font-family:"Noto Sans SC",sans-serif;color:#ccc}
body{display:flex;flex-direction:column}
main{flex:1;display:flex;overflow:hidden}
.L{flex:0 0 500px;background:#1E1E1E;overflow-y:auto;border-right:1px solid #333;scroll-behavior:smooth}
.R{flex:1;background:#FAF8F5;overflow-y:auto;scroll-behavior:smooth}
.src{padding:16px 20px;font-family:"SF Mono","Menlo","Cascadia Code",monospace;font-size:13px;line-height:1.85;color:#707070}
.src .delim{color:#6A9955;display:block}
.src .yaml-line{display:flex;cursor:pointer;padding:1px 6px;margin:0 -6px;border-left:3px solid transparent;transition:background .12s,border-color .12s}
.src .yaml-line:hover{background:rgba(255,255,255,.04);color:#aaa}
.src .yaml-line.hl{background:rgba(212,168,67,.15);color:#E8D8A8;border-left-color:#D4A843}
.src .yaml-k{color:#B5CEA8;min-width:90px;flex-shrink:0}
.src .yaml-v{color:#CE9178}
.src .yaml-opts{margin:3px 0 8px 14px;display:flex;flex-wrap:wrap;gap:4px}
.src .yaml-opt{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border:1px solid #444;border-radius:3px;cursor:pointer;font-size:11px;color:#888;transition:.12s}
.src .yaml-opt:hover{border-color:#888;color:#ccc}
.src .yaml-opt.sel{border-color:#D4A843;color:#D4A843;background:rgba(212,168,67,.08)}
.src .yaml-opt svg{width:18px;height:18px}
.src .md-body{margin-top:12px;white-space:pre-wrap}
.src .md-body .mh1{color:#D4D4D4;font-weight:700}
.src .md-body .mh2{color:#C586C0}
.src .md-body .mh3{color:#B5CEA8}
.src .md-body .mlead{color:#E8D8A8;font-weight:700}
.src .md-body .mquote{color:#4EC9B0;padding-left:8px;border-left:2px solid #4EC9B0;display:block}
.src .md-body .mdiv{color:#6A9955}
.src .md-body .mnote{color:#6A9955;font-style:italic}
.src .md-body .mimg{color:#CE9178}
.src .md-body .mpara{color:#9CDCFE}
.hl-ring{outline:4px solid #D4A843;outline-offset:5px;border-radius:3px}
.cvr-wrap{text-align:center;padding:16px 0 4px}
.cvr-wrap .cvr-label{font-size:11px;color:#B8A578;letter-spacing:.1em;margin-bottom:8px}
.cvr-wrap .cover{width:900px;max-width:100%;margin:0 auto;aspect-ratio:900/383;height:auto;text-align:left}
</style>
</head>

**七月的滇中，雨水把空气泡得发软。**我们走进云南白药集团，脚下的泥土还带着前一夜的潮气。

# 从田间到车间

<!-- paragraph: anchor-satellite -->
![三七种植基地全景](img/photo.jpg)
![采挖现场](img/photo.jpg)
![根茎分选](img/photo.jpg)
![质检台](img/photo.jpg)

种植基地位于文山州丘北县的缓坡地带。这里海拔 1600 米，年均温 16°C，是 *Panax notoginseng* 最适宜的生长环境。每一株三七从播种到采收需要整整三年——第一年育苗，第二年移栽，第三年采挖。

## 三年一株

三年里，三七要熬过滇南的雨季、旱季和霜冻。农户说，种三七像养孩子——"第一年怕它死，第二年怕它病，第三年怕卖不上价"。

**穿上白大褂、戴上发套和鞋套，我们在风淋室门口站了整整三分钟。**GMP 车间的洁净标准是十万级——这意味着每立方米空气中直径大于 0.5 微米的尘埃粒子不得超过三百五十万个。

## 第一站：原料前处理

三七从仓库到车间，要过的第一关是清洗。不是水龙头冲冲那么简单——三道纯化水清洗，再经臭氧消毒。工人说，这个环节最容易出问题的是泥沙残留，"一株三七的根须缝里，能藏半两土"。

![清洗线上的三七根茎](img/photo.jpg)

清洗后的三七进入低温干燥房，48 小时，温度严格控制在 45°C 以下。超过这个温度，三七皂苷 R1 就开始降解。

> 低温干燥是整个工艺链里最「慢」的环节，但没有人敢加速。
> — 车间技术主管

## 第二站：提取与制剂

**晋宁区地处滇中腹地，是连接昆明主城与滇南的重要节点。**近年来，该区在「一县一业」政策推动下，逐步形成了以中药材种植为上游、生物医药加工为中游、健康产品消费为下游的完整产业链雏形。

# 产业背景

## 上游：种植端

晋宁区中药材种植面积约 8.6 万亩，主栽品种包括三七、重楼、石斛、黄精等。其中 *Paris polyphylla* var. *yunnanensis*（滇重楼）因白药需求增长，种植面积近三年翻了一番。但分散化经营、标准化程度低仍是主要瓶颈——全区 60% 以上的种植户为散户，缺乏统一的 GAP 种植规范。

## 中游：加工端

云南白药集团是晋宁中药材加工的核心企业。其 GMP 生产基地占地 300 余亩，年处理中药材原料能力超万吨。除白药外，区内还有十余家中型饮片加工企业和若干提取物生产企业，形成了一定规模的产业集群。

### 关键数据

2025 年晋宁区生物医药产业总产值约 47 亿元，其中中药材加工环节贡献约 18 亿元。对比云南全省 300 亿元的生物医药产值，晋宁占比约 15%——「有基础，但远未到天花板」。

> 产业的核心问题不是「种不出来」，而是「种出来了怎么卖、卖给谁、卖出什么价」。
> — 晋宁区农业农村局 · 产业科

# 调研框架

本次实践支队 28 名队员分为三组，分别对应产业链的上、中、下游：

## A 组 · 上游

聚焦种植端：田间调研、农户访谈、GAP 规范评估。重点考察三七和重楼的种植现状。

## B 组 · 中游

聚焦加工端：参访白药 GMP 车间、中小饮片企业。重点考察加工技术、质量控制和产业带动效应。

## C 组 · 下游

聚焦消费端：走访健康产品终端市场。重点考察消费者认知、品牌建设和「中药材+大健康」的融合路径。

<div class="article-body">
  <p class="art-p"><span class="lead">晋宁区地处滇中腹地，是连接昆明主城与滇南的重要节点。</span>近年来，该区在「一县一业」政策推动下，逐步形成了以中药材种植为上游、生物医药加工为中游、健康产品消费为下游的完整产业链雏形。</p>
<h1 class="art-h1">产业背景</h1>
<h2 class="art-sec-h1">上游：种植端</h2>
<p class="art-p">晋宁区中药材种植面积约 8.6 万亩，主栽品种包括三七、重楼、石斛、黄精等。其中 <span class="art-latin">Paris polyphylla</span> var. <span class="art-latin">yunnanensis</span>（滇重楼）因白药需求增长，种植面积近三年翻了一番。但分散化经营、标准化程度低仍是主要瓶颈——全区 60% 以上的种植户为散户，缺乏统一的 GAP 种植规范。</p>
<h2 class="art-sec-h1">中游：加工端</h2>
<p class="art-p">云南白药集团是晋宁中药材加工的核心企业。其 GMP 生产基地占地 300 余亩，年处理中药材原料能力超万吨。除白药外，区内还有十余家中型饮片加工企业和若干提取物生产企业，形成了一定规模的产业集群。</p>
<h3 class="art-h2">关键数据</h3>
<p class="art-p">2025 年晋宁区生物医药产业总产值约 47 亿元，其中中药材加工环节贡献约 18 亿元。对比云南全省 300 亿元的生物医药产值，晋宁占比约 15%——「有基础，但远未到天花板」。</p>
<blockquote class="art-quote">产业的核心问题不是「种不出来」，而是「种出来了怎么卖、卖给谁、卖出什么价」。<span class="src">— 晋宁区农业农村局 · 产业科</span></blockquote>
<h1 class="art-h1">调研框架</h1>
<p class="art-p">本次实践支队 28 名队员分为三组，分别对应产业链的上、中、下游：</p>
<h2 class="art-sec-h1">A 组 · 上游</h2>
<p class="art-p">聚焦种植端：田间调研、农户访谈、GAP 规范评估。重点考察三七和重楼的种植现状。</p>
<h2 class="art-sec-h1">B 组 · 中游</h2>
<p class="art-p">聚焦加工端：参访白药 GMP 车间、中小饮片企业。重点考察加工技术、质量控制和产业带动效应。</p>
<h2 class="art-sec-h1">C 组 · 下游</h2>
<p class="art-p">聚焦消费端：走访健康产品终端市场。重点考察消费者认知、品牌建设和「中药材+大健康」的融合路径。</p>
